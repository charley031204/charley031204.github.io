<text x="95" y="309" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Aspirin (아세틸화)</text>
<line x1="172" y1="295" x2="196" y2="295" stroke="#c0392b" stroke-width="2.2" marker-end="url(#inh)"/>

<rect x="530" y="274" width="180" height="42" rx="5" fill="#e8f4ea" stroke="#1e8449" stroke-width="2"/>
<text x="620" y="293" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">5-LOX</text>
<text x="620" y="310" text-anchor="middle" font-size="13" fill="#1e8449">( FLAP 결합 필요 )</text>

<rect x="740" y="274" width="150" height="42" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
<text x="815" y="301" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Zileuton</text>
<line x1="738" y1="295" x2="714" y2="295" stroke="#c0392b" stroke-width="2.2" marker-end="url(#inh)"/>

<line x1="290" y1="318" x2="290" y2="354" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
<line x1="620" y1="318" x2="620" y2="354" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

<rect x="200" y="356" width="180" height="40" rx="5" fill="#fdf6e3" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="290" y="381" text-anchor="middle" font-size="15" fill="#1a1a1a">PGG2 → PGH2</text>

<rect x="530" y="356" width="180" height="40" rx="5" fill="#fdf6e3" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="620" y="381" text-anchor="middle" font-size="15" fill="#1a1a1a">5-HPETE → LTA4</text>

<line x1="255" y1="398" x2="70" y2="428" stroke="#333333" stroke-width="1.6" marker-end="url(#arw)"/>
<line x1="278" y1="398" x2="168" y2="428" stroke="#333333" stroke-width="1.6" marker-end="url(#arw)"/>
<line x1="300" y1="398" x2="268" y2="428" stroke="#333333" stroke-width="1.6" marker-end="url(#arw)"/>
<line x1="322" y1="398" x2="365" y2="428" stroke="#333333" stroke-width="1.6" marker-end="url(#arw)"/>

<rect x="15" y="430" width="92" height="40" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
<text x="61" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">TXA2</text>
<rect x="117" y="430" width="92" height="40" rx="5" fill="#eaf3fb" stroke="#2471a3" stroke-width="1.5"/>
<text x="163" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#2471a3">PGI2</text>
<rect x="219" y="430" width="92" height="40" rx="5" fill="#eaf3fb" stroke="#2471a3" stroke-width="1.5"/>
<text x="265" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#2471a3">PGE2</text>
<rect x="321" y="430" width="92" height="40" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
<text x="367" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">PGF2a</text>

<text x="61" y="490" text-anchor="middle" font-size="13" fill="#c0392b">혈관 수축</text>
<text x="61" y="507" text-anchor="middle" font-size="13" fill="#c0392b">응집 촉진</text>
<text x="163" y="490" text-anchor="middle" font-size="13" fill="#2471a3">혈관 확장</text>
<text x="163" y="507" text-anchor="middle" font-size="13" fill="#2471a3">응집 억제</text>
<text x="265" y="490" text-anchor="middle" font-size="13" fill="#2471a3">혈관 확장</text>
<text x="265" y="507" text-anchor="middle" font-size="13" fill="#2471a3">기관지 확장</text>
<text x="367" y="490" text-anchor="middle" font-size="13" fill="#c0392b">혈관 수축</text>
<text x="367" y="507" text-anchor="middle" font-size="13" fill="#c0392b">자궁 수축</text>

<line x1="600" y1="398" x2="530" y2="428" stroke="#333333" stroke-width="1.6" marker-end="url(#arw)"/>
<line x1="645" y1="398" x2="740" y2="428" stroke="#333333" stroke-width="1.6" marker-end="url(#arw)"/>

<rect x="455" y="430" width="135" height="40" rx="5" fill="#fdf6e3" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="522" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">LTB4</text>
<text x="522" y="490" text-anchor="middle" font-size="13" fill="#444444">호중구 화학주성</text>

<rect x="620" y="430" width="260" height="46" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
<text x="750" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">LTC4 · LTD4 · LTE4</text>
<text x="750" y="468" text-anchor="middle" font-size="13" fill="#c0392b">cysteinyl leukotriene = SRS-A</text>

<line x1="785" y1="478" x2="785" y2="496" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
<rect x="690" y="498" width="190" height="40" rx="5" fill="#eaf3fb" stroke="#2471a3" stroke-width="1.6"/>
<text x="785" y="523" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">CysLT1 수용체 (Gq)</text>

<rect x="600" y="568" width="280" height="46" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
<text x="740" y="588" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Montelukast · Zafirlukast</text>
<text x="740" y="606" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Pranlukast</text>
<line x1="785" y1="566" x2="785" y2="542" stroke="#c0392b" stroke-width="2.2" marker-end="url(#inh)"/>

<text x="740" y="644" text-anchor="middle" font-size="13" fill="#444444">기관지 수축 · 점액분비 · 모세관 투과성 증가</text>

<rect x="15" y="546" width="420" height="112" rx="5" fill="#fafafa" stroke="#999999" stroke-width="1.2"/>
<text x="30" y="568" font-size="14" font-weight="bold" fill="#1a1a1a">약물 작용점 — 같은 경로의 서로 다른 지점</text>
<text x="30" y="590" font-size="13" fill="#c0392b">① Corticosteroid ⊣ PLA2      ② NSAID · Aspirin ⊣ COX</text>
<text x="30" y="610" font-size="13" fill="#c0392b">③ Zileuton ⊣ 5-LOX             ④ Montelukast ⊣ CysLT1 수용체</text>
<text x="30" y="632" font-size="13" fill="#444444">항류코트리엔 4가지 방법 = 5-LOX 저해 · 수용체 저해</text>
<text x="30" y="650" font-size="13" fill="#444444">· FLAP 저해 · PLA2 저해 (교안 p.22)</text>

</g>
</svg>
