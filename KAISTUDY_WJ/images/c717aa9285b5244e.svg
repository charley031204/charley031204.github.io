<text x="518" y="120" font-size="13" fill="#555555">PLC</text>
<text x="518" y="137" font-size="13" fill="#555555">DG lipase</text>

<rect x="340" y="180" width="220" height="44" rx="5" fill="#eaf3fb" stroke="#2471a3" stroke-width="2.2"/>
<text x="450" y="208" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">Arachidonic acid</text>

<rect x="30" y="182" width="222" height="40" rx="5" fill="#f4f4f4" stroke="#888888" stroke-width="1.3"/>
<text x="141" y="199" text-anchor="middle" font-size="13" fill="#444444">Epoxygenase (CYP450)</text>
<text x="141" y="215" text-anchor="middle" font-size="13" fill="#444444">→ EET 4종</text>
<line x1="338" y1="202" x2="258" y2="202" stroke="#888888" stroke-width="1.5" marker-end="url(#arw)"/>

<rect x="648" y="182" width="232" height="40" rx="5" fill="#f4f4f4" stroke="#888888" stroke-width="1.3"/>
<text x="764" y="199" text-anchor="middle" font-size="13" fill="#444444">Free radical (비효소적)</text>
<text x="764" y="215" text-anchor="middle" font-size="13" fill="#444444">→ isoprostane 8-epi-PGF2a</text>
<line x1="562" y1="202" x2="642" y2="202" stroke="#888888" stroke-width="1.5" marker-end="url(#arw)"/>

<line x1="420" y1="226" x2="300" y2="272" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
<line x1="480" y1="226" x2="610" y2="272" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

<rect x="200" y="274" width="180" height="42" rx="5" fill="#e8f4ea" stroke="#1e8449" stroke-width="2"/>
