<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
</marker>
<marker id="inh" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<rect x="0" y="0.5" width="2.2" height="9" fill="#c0392b"/>
</marker>
</defs>
<g font-family="Malgun Gothic, 맑은 고딕, sans-serif">

<text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Arachidonic acid 캐스케이드와 약물 작용점</text>

<rect x="320" y="54" width="260" height="38" rx="5" fill="#fdf6e3" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="450" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">세포막 인지질 (phospholipid)</text>

<rect x="30" y="110" width="220" height="42" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="1.6"/>
<text x="140" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Corticosteroid</text>
<text x="140" y="145" text-anchor="middle" font-size="13" fill="#c0392b">annexin A1 합성 유도</text>
<line x1="252" y1="131" x2="392" y2="131" stroke="#c0392b" stroke-width="2.2" marker-end="url(#inh)"/>

<line x1="400" y1="92" x2="400" y2="178" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
<text x="408" y="126" font-size="15" font-weight="bold" fill="#c0392b">PLA2</text>
