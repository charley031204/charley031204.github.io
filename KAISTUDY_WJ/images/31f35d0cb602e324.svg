<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="pr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="450" y="32" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Paraquat — redox cycling과 "산소가 금기"인 이유</text>

  <rect x="40" y="56" width="200" height="54" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="140" y="79" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">경구 섭취</text>
  <text x="140" y="99" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">5 mL로도 치명적</text>
  <line x1="240" y1="83" x2="278" y2="83" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pa)"/>

  <rect x="282" y="56" width="230" height="54" rx="6" fill="#fdf6e3" stroke="#1a1a1a" stroke-width="2"/>
  <text x="397" y="79" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">폐포세포에 능동적으로 농축</text>
  <text x="397" y="99" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">표적장기가 폐 하나로 정해진다</text>
  <line x1="512" y1="83" x2="550" y2="83" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pa)"/>

  <rect x="554" y="56" width="306" height="54" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="707" y="79" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">초기 — 피 섞인 구토 · 혈변 (위장자극)</text>
  <text x="707" y="99" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">여기서 멀쩡해 보이는 것이 함정</text>

  <text x="40" y="152" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">산화환원 순환 redox cycling — 파라쿼트는 소모되지 않고 촉매처럼 돈다</text>

  <rect x="90" y="182" width="180" height="56" rx="6" fill="#eaf2fa" stroke="#2471a3" stroke-width="2"/>
  <text x="180" y="216" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="bold" fill="#2471a3" text-anchor="middle">PQ²⁺ (paraquat)</text>

  <rect x="400" y="182" width="180" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="490" y="216" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">PQ⁺• 라디칼</text>

  <path d="M270,196 L400,196" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pa)"/>
  <text x="335" y="188" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">세포의 전자(NADPH)</text>
  <path d="M400,226 L270,226" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pa)"/>
  <text x="335" y="248" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">전자를 O₂에 넘기고 원래대로</text>

  <line x1="580" y1="210" x2="632" y2="210" stroke="#c0392b" stroke-width="2.5" marker-end="url(#pr)"/>
  <text x="606" y="200" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">+ O₂</text>

  <rect x="636" y="182" width="224" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="748" y="206" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">O₂⁻• superoxide</text>
  <text x="748" y="226" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">활성산소가 계속 쌓인다</text>

  <line x1="606" y1="296" x2="606" y2="226" stroke="#c0392b" stroke-width="2.5" marker-end="url(#pr)"/>
  <text x="606" y="316" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">산소 = 이 순환의 연료</text>

  <line x1="748" y1="238" x2="748" y2="272" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pa)"/>
  <rect x="636" y="276" width="224" height="44" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="748" y="304" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">폐포 상피 손상 (2~3일)</text>
  <line x1="748" y1="320" x2="748" y2="352" stroke="#1a1a1a" stroke-width="2" marker-end="url(#pa)"/>
  <rect x="636" y="356" width="224" height="44" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="748" y="384" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">중증 폐섬유증 → 사망</text>

  <rect x="40" y="336" width="520" height="118" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="60" y="362" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">고농도 산소는 금기다</text>
  <text x="60" y="388" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a">산소를 더 주면 순환의 원료를 더 붓는 셈 → 활성산소 생성 증가</text>
  <text x="60" y="410" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a">→ 폐손상과 폐섬유화가 오히려 빨라진다</text>
  <text x="60" y="436" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">다른 중독에서는 산소가 치료 — 여기서만 방향이 반대다</text>

  <rect x="40" y="470" width="820" height="72" rx="6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="60" y="494" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">해독제가 없다 · 최선의 유지요법에도 생존율 50% 미만</text>
  <text x="60" y="516" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a">처치 순서  ① 조기 위장관 제거 — 활성탄 또는 Fuller's earth(백토) 흡착   ② 조기 혈액관류(hemoperfusion)</text>
  <text x="60" y="536" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#1a1a1a">                   ③ 면역억제요법(근거 제한적)   ④ 산소는 최소한으로</text>
</svg>
