<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#2471a3"/>
    </marker>
    <marker id="ak" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="440" y="32" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a">Salicylate 의 산–염기 변화 — 용량이 방향을 뒤집는다</text>
  <text x="440" y="54" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" fill="#5d6d7e">교안 p.22 · 같은 호흡중추가 한 번은 흥분하고 한 번은 억제된다</text>

  <rect x="30" y="76" width="380" height="230" rx="10" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="220" y="104" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="17" font-weight="bold" fill="#2471a3">치료 · 중등도 용량</text>
  <text x="50" y="136" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">호흡중추 흥분</text>
  <line x1="60" y1="146" x2="60" y2="168" stroke="#2471a3" stroke-width="2" marker-end="url(#ab)"/>
  <text x="76" y="176" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">과호흡 (hyperventilation)</text>
  <line x1="60" y1="186" x2="60" y2="208" stroke="#2471a3" stroke-width="2" marker-end="url(#ab)"/>
  <text x="76" y="216" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" fill="#1a1a1a">CO₂ 배출 ↑ → 혈중 CO₂ ↓</text>
  <line x1="60" y1="226" x2="60" y2="248" stroke="#2471a3" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="50" y="254" width="340" height="38" rx="7" fill="#d6eaf8" stroke="#1b4f72" stroke-width="2"/>
  <text x="220" y="279" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="17" font-weight="bold" fill="#1b4f72">호흡 알칼리증</text>

  <line x1="418" y1="190" x2="462" y2="190" stroke="#c0392b" stroke-width="3" marker-end="url(#ak)"/>
  <text x="440" y="178" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">용량 ↑</text>

  <rect x="470" y="76" width="380" height="230" rx="10" fill="#fdf2f0" stroke="#c0392b" stroke-width="2"/>
  <text x="660" y="104" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="17" font-weight="bold" fill="#c0392b">중독 용량</text>
  <text x="490" y="136" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">호흡중추 억제</text>
  <line x1="500" y1="146" x2="500" y2="168" stroke="#c0392b" stroke-width="2" marker-end="url(#ak)"/>
  <text x="516" y="176" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" fill="#1a1a1a">환기 감소 → CO₂ 축적</text>
  <text x="490" y="200" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">＋ 유기산 축적</text>
  <line x1="500" y1="210" x2="500" y2="248" stroke="#c0392b" stroke-width="2" marker-end="url(#ak)"/>
  <rect x="490" y="254" width="340" height="38" rx="7" fill="#f9ebea" stroke="#7b241c" stroke-width="2"/>
  <text x="660" y="279" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="17" font-weight="bold" fill="#7b241c">호흡산증 · 대사산증 혼합</text>

  <rect x="30" y="322" width="820" height="58" rx="8" fill="#fef9e7" stroke="#b7950b" stroke-width="1.5"/>
  <text x="46" y="345" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#9a7d0a">동반 소견 — Salicylism (고용량)</text>
  <text x="46" y="368" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" fill="#1a1a1a">구토 · 이명 · 청력 감소 · 어지러움 — 감량하면 회복된다. 과호흡은 연수에 대한 직접 작용이다 (교안 p.22)</text>

  <rect x="30" y="392" width="820" height="34" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="46" y="415" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" fill="#1a1a1a">처치 (교안 p.23·24) — 위세척 · 수액과 전해질 교정 · <tspan font-weight="bold" fill="#1e8449">중탄산나트륨으로 소변 알칼리화 → salicylate 배설 촉진</tspan></text>

  <text x="440" y="452" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#1e8449">소크라티브 N05 5번이 정확히 왼쪽 상자를 물었다 — 문두의 &quot;치료용량~중등도 용량&quot;이 열쇠다</text>
</svg>
