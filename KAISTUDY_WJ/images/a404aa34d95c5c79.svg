<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 640" width="970" height="640">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arwG" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1e8449"/>
    </marker>
    <marker id="stop" markerWidth="10" markerHeight="12" refX="4" refY="6" orient="auto">
      <rect x="0" y="0" width="3.5" height="12" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="485" y="28" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GH 축과 약물의 작용점 — 보충하는 약(왼쪽) vs 막는 약(오른쪽)</text>

  <!-- 축 라벨 -->
  <text x="252" y="55" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#7f8c8d">시상하부</text>
  <text x="292" y="170" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#7f8c8d">뇌하수체 전엽</text>
  <text x="292" y="290" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#7f8c8d">표적조직 (GH 수용체)</text>
  <text x="332" y="400" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#7f8c8d">표적조직 산물</text>

  <!-- 중앙 축 -->
  <rect x="250" y="60" width="140" height="40" rx="6" fill="#d6eaf8" stroke="#2471a3" stroke-width="2"/>
  <text x="320" y="85" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a4e73" text-anchor="middle">GHRH ⊕</text>

  <rect x="415" y="60" width="165" height="40" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="497" y="85" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#145a32" text-anchor="middle">somatostatin ⊖</text>

  <rect x="290" y="175" width="250" height="50" rx="6" fill="#fdebd0" stroke="#b9770e" stroke-width="2"/>
  <text x="415" y="196" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#7e5109" text-anchor="middle">somatotrope</text>
  <text x="415" y="215" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#7e5109" text-anchor="middle">박동적 GH 분비 (Ca²⁺ 진동)</text>

  <rect x="290" y="295" width="250" height="50" rx="6" fill="#eaeded" stroke="#566573" stroke-width="2"/>
  <text x="415" y="316" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">간 · 근육 · 지방</text>
  <text x="415" y="335" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">GH 수용체 이량체화 → JAK2</text>

  <rect x="325" y="405" width="180" height="48" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="415" y="435" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="17" font-weight="bold" fill="#922b21" text-anchor="middle">IGF-1</text>

  <rect x="290" y="512" width="250" height="46" rx="6" fill="#eaeded" stroke="#566573" stroke-width="2"/>
  <text x="415" y="541" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">골단연골 세포분열 → 키 성장</text>

  <!-- 축 화살표 -->
  <line x1="330" y1="100" x2="368" y2="172" stroke="#2471a3" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="490" y1="100" x2="462" y2="172" stroke="#1e8449" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arwG)"/>
  <line x1="415" y1="225" x2="415" y2="292" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="428" y="264" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">GH</text>
  <line x1="415" y1="345" x2="415" y2="402" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="415" y1="453" x2="415" y2="509" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- 왼쪽: 보충하는 약 -->
  <text x="115" y="48" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#1e8449" text-anchor="middle">밀어 올리는 쪽 ⊕</text>

  <rect x="20" y="60" width="190" height="40" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="115" y="77" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#145a32" text-anchor="middle">Ghrelin (위 기저부)</text>
  <text x="115" y="93" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" fill="#145a32" text-anchor="middle">공복·저혈당 → GHS-R</text>
  <line x1="210" y1="80" x2="247" y2="80" stroke="#1e8449" stroke-width="2.5" marker-end="url(#arwG)"/>

  <rect x="20" y="118" width="190" height="42" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
  <text x="115" y="136" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#145a32" text-anchor="middle">sermorelin</text>
  <text x="115" y="152" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" fill="#145a32" text-anchor="middle">합성 GHRH — 진단용</text>
  <line x1="210" y1="132" x2="272" y2="103" stroke="#1e8449" stroke-width="2.5" marker-end="url(#arwG)"/>

  <rect x="20" y="238" width="190" height="48" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.5"/>
  <text x="115" y="257" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#145a32" text-anchor="middle">somatropin (rhGH)</text>
  <text x="115" y="275" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" fill="#145a32" text-anchor="middle">GH 그 자체 — 수용체 자극</text>
  <line x1="210" y1="262" x2="398" y2="262" stroke="#1e8449" stroke-width="2.5" marker-end="url(#arwG)"/>
  <text x="115" y="303" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">25-14 · GH 결핍 소아</text>

  <rect x="20" y="405" width="190" height="48" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.5"/>
  <text x="115" y="424" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#145a32" text-anchor="middle">mecasermin (rhIGF-1)</text>
  <text x="115" y="442" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" fill="#145a32" text-anchor="middle">IGF-1을 직접 채운다</text>
  <line x1="210" y1="429" x2="322" y2="429" stroke="#1e8449" stroke-width="2.5" marker-end="url(#arwG)"/>
  <text x="115" y="470" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Laron형 · N08 7번</text>

  <!-- 오른쪽: 막는 약 -->
  <text x="795" y="48" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">눌러 내리는 쪽 ⊣ (말단비대증)</text>

  <rect x="640" y="140" width="310" height="52" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2.5"/>
  <text x="795" y="159" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#922b21" text-anchor="middle">① octreotide · lanreotide</text>
  <text x="795" y="178" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" fill="#922b21" text-anchor="middle">SSTR2·SSTR5 작동 → GH 분비를 막는다</text>
  <line x1="638" y1="172" x2="545" y2="190" stroke="#c0392b" stroke-width="2.5" marker-end="url(#stop)"/>
  <text x="795" y="208" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">25-36 — 약물 1순위</text>

  <rect x="640" y="222" width="310" height="52" rx="6" fill="#fef9e7" stroke="#b9770e" stroke-width="2"/>
  <text x="795" y="241" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#7e5109" text-anchor="middle">③ cabergoline · bromocriptine</text>
  <text x="795" y="260" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" fill="#7e5109" text-anchor="middle">D₂ 작동 → GH 분비 억제 (보조·2순위)</text>
  <line x1="638" y1="248" x2="545" y2="215" stroke="#b9770e" stroke-width="2.5" marker-end="url(#stop)"/>

  <rect x="640" y="298" width="310" height="52" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2.5"/>
  <text x="795" y="317" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#922b21" text-anchor="middle">② pegvisomant</text>
  <text x="795" y="336" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" fill="#922b21" text-anchor="middle">GH 수용체 이량체화 차단 — 수용체를 막는다</text>
  <line x1="638" y1="324" x2="545" y2="322" stroke="#c0392b" stroke-width="2.5" marker-end="url(#stop)"/>
  <text x="795" y="366" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">25-6 · N08 8번 — GH는 안 낮춘다 → IGF-1로 감시</text>

  <!-- 하단 정리 -->
  <rect x="20" y="580" width="930" height="46" rx="6" fill="#f4f6f6" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="34" y="600" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#1a1a1a">되먹임 — GH와 IGF-1은 GHRH를 억제하고 somatostatin을 촉진한다 (이중 음성 되먹임).</text>
  <text x="34" y="618" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#1a1a1a">같은 축의 정반대 두 약 — somatropin(수용체 자극, 25-14) ↔ pegvisomant(수용체 길항, 25-6). 화살표 방향이 이 강의의 핵심 함정이다.</text>
</svg>
