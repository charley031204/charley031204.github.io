<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="420" y="32" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a">PTH · 비타민 D · FGF23 — 칼슘과 인산염의 방향 매트릭스</text>
  <text x="420" y="55" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#555555">교안 표 42-1을 화살표 방향만 남기고 압축한 것 (교안 p.20)</text>

  <!-- 헤더 -->
  <rect x="25" y="75" width="205" height="52" fill="#eaecee" stroke="#7f8c8d" stroke-width="1.5"/>
  <rect x="230" y="75" width="195" height="52" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <rect x="425" y="75" width="195" height="52" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <rect x="620" y="75" width="195" height="52" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="327" y="99" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="16" font-weight="bold" fill="#2471a3">PTH</text>
  <text x="327" y="118" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#1a1a1a">부갑상샘 · 84 aa</text>
  <text x="522" y="99" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="16" font-weight="bold" fill="#1e8449">1,25(OH)₂D</text>
  <text x="522" y="118" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#1a1a1a">피부 → 간 → 콩팥</text>
  <text x="717" y="99" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">FGF23</text>
  <text x="717" y="118" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#1a1a1a">뼈(골세포) · 251 aa</text>

  <!-- 1행 혈중 칼슘 -->
  <rect x="25" y="127" width="205" height="64" fill="#f8f9f9" stroke="#7f8c8d" stroke-width="1.5"/>
  <rect x="230" y="127" width="195" height="64" fill="#ffffff" stroke="#aab7b8" stroke-width="1.5"/>
  <rect x="425" y="127" width="195" height="64" fill="#ffffff" stroke="#aab7b8" stroke-width="1.5"/>
  <rect x="620" y="127" width="195" height="64" fill="#ffffff" stroke="#aab7b8" stroke-width="1.5"/>
  <text x="42" y="166" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">혈중 칼슘</text>
  <text x="327" y="163" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="bold" fill="#1e8449">↑</text>
  <text x="327" y="182" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#555555">콩팥 재흡수 ↑ · 뼈 유리 ↑</text>
  <text x="522" y="163" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="bold" fill="#1e8449">↑</text>
  <text x="522" y="182" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#555555">장 흡수 ↑ (직접)</text>
  <text x="717" y="163" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="20" font-weight="bold" fill="#7f8c8d">—</text>
  <text x="717" y="182" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#555555">인산염 저하에 수반</text>

  <!-- 2행 혈중 인산염 (강조) -->
  <rect x="25" y="191" width="205" height="70" fill="#fef9e7" stroke="#b7950b" stroke-width="2.5"/>
  <rect x="230" y="191" width="195" height="70" fill="#fef9e7" stroke="#b7950b" stroke-width="2.5"/>
  <rect x="425" y="191" width="195" height="70" fill="#fef9e7" stroke="#b7950b" stroke-width="2.5"/>
  <rect x="620" y="191" width="195" height="70" fill="#fef9e7" stroke="#b7950b" stroke-width="2.5"/>
  <text x="42" y="226" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">혈중 인산염</text>
  <text x="42" y="247" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" font-weight="bold" fill="#b7950b">셋을 가르는 유일한 칸</text>
  <text x="327" y="230" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="26" font-weight="bold" fill="#c0392b">↓</text>
  <text x="327" y="250" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#555555">콩팥 재흡수 억제 → 배설 ↑</text>
  <text x="522" y="230" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="26" font-weight="bold" fill="#1e8449">↑</text>
  <text x="522" y="250" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#555555">장 흡수 ↑ · 콩팥 재흡수 ↑</text>
  <text x="717" y="230" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="26" font-weight="bold" fill="#c0392b">↓↓</text>
  <text x="717" y="250" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#555555">배설 ↑ + 1α-hydroxylase 억제</text>

  <!-- 3행 콩팥 -->
  <rect x="25" y="261" width="205" height="64" fill="#f8f9f9" stroke="#7f8c8d" stroke-width="1.5"/>
  <rect x="230" y="261" width="195" height="64" fill="#ffffff" stroke="#aab7b8" stroke-width="1.5"/>
  <rect x="425" y="261" width="195" height="64" fill="#ffffff" stroke="#aab7b8" stroke-width="1.5"/>
  <rect x="620" y="261" width="195" height="64" fill="#ffffff" stroke="#aab7b8" stroke-width="1.5"/>
  <text x="42" y="298" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">콩팥 배설</text>
  <text x="327" y="288" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12.5" fill="#1a1a1a">칼슘 배설 ↓</text>
  <text x="327" y="308" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12.5" font-weight="bold" fill="#c0392b">인산염 배설 ↑</text>
  <text x="522" y="288" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12.5" fill="#1a1a1a">칼슘 배설 ↓</text>
  <text x="522" y="308" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12.5" font-weight="bold" fill="#1e8449">인산염 배설 ↓</text>
  <text x="717" y="298" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12.5" font-weight="bold" fill="#c0392b">인산염 배설 ↑</text>

  <!-- 4행 장관 -->
  <rect x="25" y="325" width="205" height="64" fill="#f8f9f9" stroke="#7f8c8d" stroke-width="1.5"/>
  <rect x="230" y="325" width="195" height="64" fill="#ffffff" stroke="#aab7b8" stroke-width="1.5"/>
  <rect x="425" y="325" width="195" height="64" fill="#ffffff" stroke="#aab7b8" stroke-width="1.5"/>
  <rect x="620" y="325" width="195" height="64" fill="#ffffff" stroke="#aab7b8" stroke-width="1.5"/>
  <text x="42" y="362" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">장관 흡수</text>
  <text x="327" y="353" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12.5" fill="#1a1a1a">칼슘·인산염 ↑</text>
  <text x="327" y="373" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#555555">비타민 D를 켜서 얻는 간접효과</text>
  <text x="522" y="353" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12.5" fill="#1a1a1a">칼슘·인산염 ↑</text>
  <text x="522" y="373" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#555555">TRPV6·calbindin — 직접효과</text>
  <text x="717" y="353" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12.5" fill="#1a1a1a">칼슘·인산염 ↓</text>
  <text x="717" y="373" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="11.5" fill="#555555">비타민 D를 꺼서 생기는 결과</text>

  <!-- 결론 -->
  <rect x="25" y="405" width="790" height="50" rx="8" fill="#fbfcfc" stroke="#b7950b" stroke-width="2"/>
  <text x="420" y="426" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">칼슘 줄은 셋 다 올리는 쪽이라 구별이 안 된다. 갈리는 칸은 인산염 하나뿐이다 —</text>
  <text x="420" y="446" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">PTH ↓ · 비타민 D ↑ · FGF23 ↓↓</text>
</svg>
