<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ng" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1e8449"/>
    </marker>
    <marker id="nk" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ns" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#888888"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">Natriuretic peptide 축 — 만들어지고, 신호하고, 분해된다</text>
  <text x="450" y="58" text-anchor="middle" font-size="13.5" fill="#555555">공통 구조 = 17-아미노산 이황화 고리 · 수용체 자체가 guanylyl cyclase라서 산물은 cGMP</text>

  <!-- peptides -->
  <rect x="60" y="80" width="200" height="54" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.8"/>
  <text x="160" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ANP</text>
  <text x="160" y="123" text-anchor="middle" font-size="12.5" fill="#555555">심방 (Atrial)</text>

  <rect x="300" y="80" width="200" height="54" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.8"/>
  <text x="400" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">BNP</text>
  <text x="400" y="123" text-anchor="middle" font-size="12.5" fill="#555555">뇌 (Brain)</text>

  <rect x="540" y="80" width="190" height="54" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.8"/>
  <text x="635" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">CNP</text>
  <text x="635" y="123" text-anchor="middle" font-size="12.5" fill="#555555">C-type</text>

  <rect x="748" y="80" width="144" height="54" rx="6" fill="#f4f6f6" stroke="#888888" stroke-width="1.8"/>
  <text x="820" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Urodilatin</text>
  <text x="820" y="122" text-anchor="middle" font-size="11.5" fill="#555555">ANP + N말단 4 AA</text>

  <!-- arrows to receptors -->
  <line x1="160" y1="134" x2="248" y2="186" stroke="#1e8449" stroke-width="2.2" marker-end="url(#ng)"/>
  <line x1="400" y1="134" x2="318" y2="186" stroke="#1e8449" stroke-width="2.2" marker-end="url(#ng)"/>
  <line x1="635" y1="134" x2="548" y2="186" stroke="#1e8449" stroke-width="2.2" marker-end="url(#ng)"/>
  <line x1="690" y1="134" x2="762" y2="186" stroke="#888888" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ns)"/>

  <!-- receptors -->
  <rect x="150" y="190" width="250" height="58" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="2.2"/>
  <text x="275" y="213" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">NPR-A  (GC-A)</text>
  <text x="275" y="234" text-anchor="middle" font-size="12.5" fill="#555555">ANP = BNP</text>

  <rect x="430" y="190" width="200" height="58" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="2.2"/>
  <text x="530" y="213" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">NPR-B  (GC-B)</text>
  <text x="530" y="234" text-anchor="middle" font-size="12.5" fill="#555555">CNP</text>

  <rect x="660" y="190" width="230" height="58" rx="6" fill="#f4f6f6" stroke="#888888" stroke-width="2"/>
  <text x="775" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">NPR-C</text>
  <text x="775" y="234" text-anchor="middle" font-size="12" fill="#555555">ANP = CNP &gt; BNP</text>

  <line x1="275" y1="248" x2="275" y2="286" stroke="#1e8449" stroke-width="2.4" marker-end="url(#ng)"/>
  <line x1="530" y1="248" x2="530" y2="286" stroke="#1e8449" stroke-width="2.4" marker-end="url(#ng)"/>
  <line x1="775" y1="248" x2="775" y2="288" stroke="#888888" stroke-width="2.2" marker-end="url(#ns)"/>

  <!-- cGMP -->
  <rect x="150" y="290" width="480" height="52" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="2.2"/>
  <text x="390" y="313" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">GTP  →  cGMP  →  PKG 활성화</text>
  <text x="390" y="333" text-anchor="middle" font-size="12" fill="#555555">cAMP가 아니다 — 수용체 자체가 guanylyl cyclase다</text>

  <rect x="655" y="292" width="235" height="56" rx="6" fill="#f4f6f6" stroke="#888888" stroke-width="1.8"/>
  <text x="772" y="313" text-anchor="middle" font-size="12.5" fill="#1a1a1a">제거 수용체 (clearance)</text>
  <text x="772" y="333" text-anchor="middle" font-size="12" fill="#555555">내포작용 → 펩타이드 분해 → 재활용</text>

  <!-- split to effects -->
  <line x1="390" y1="342" x2="390" y2="368" stroke="#1e8449" stroke-width="2.4"/>
  <line x1="250" y1="368" x2="570" y2="368" stroke="#1e8449" stroke-width="2.4"/>
  <line x1="250" y1="368" x2="250" y2="384" stroke="#1e8449" stroke-width="2.4" marker-end="url(#ng)"/>
  <line x1="570" y1="368" x2="570" y2="384" stroke="#1e8449" stroke-width="2.4" marker-end="url(#ng)"/>

  <rect x="110" y="388" width="280" height="64" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.8"/>
  <text x="250" y="411" text-anchor="middle" font-size="13" fill="#1a1a1a">혈관내피세포 K+ 통로 개방</text>
  <text x="250" y="434" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">→  혈관 확장</text>

  <rect x="420" y="388" width="300" height="64" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.8"/>
  <text x="570" y="411" text-anchor="middle" font-size="13" fill="#1a1a1a">신장 세뇨관 · 집합관</text>
  <text x="570" y="434" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">→  Na+ 재흡수 억제 (이뇨)</text>

  <!-- degradation -->
  <rect x="60" y="490" width="340" height="66" rx="6" fill="#fef9e7" stroke="#b9770e" stroke-width="1.8"/>
  <text x="76" y="512" font-size="13" font-weight="bold" fill="#b9770e">NEP 24.11  =  neprilysin</text>
  <text x="76" y="531" font-size="12" fill="#1a1a1a">고리 절단 (ring cleavage) · 신장 · 간 · 폐에서 대사</text>
  <text x="76" y="549" font-size="12" fill="#555555">ANP = CNP &gt; BNP</text>

  <rect x="420" y="490" width="200" height="66" rx="6" fill="#fef9e7" stroke="#b9770e" stroke-width="1.8"/>
  <text x="436" y="512" font-size="13" font-weight="bold" fill="#b9770e">IDE</text>
  <text x="436" y="531" font-size="12" fill="#1a1a1a">꼬리 절단 (tail cleavage)</text>
  <text x="436" y="549" font-size="12" fill="#555555">insulin degrading enzyme</text>

  <rect x="640" y="496" width="250" height="62" rx="6" fill="#f4f6f6" stroke="#888888" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="656" y="518" font-size="12.5" font-weight="bold" fill="#555555">Sacubitril (교안 밖)</text>
  <text x="656" y="537" font-size="11.5" fill="#1a1a1a">neprilysin을 막으면</text>
  <text x="656" y="553" font-size="11.5" fill="#1a1a1a">natriuretic peptide가 늘어난다</text>
  <path d="M 765 496 L 765 476 L 230 476 L 230 486" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="204" y1="486" x2="256" y2="486" stroke="#c0392b" stroke-width="4.5"/>

  <!-- bottom -->
  <rect x="40" y="580" width="820" height="62" rx="6" fill="#f8f9f9" stroke="#aaaaaa" stroke-width="1.5"/>
  <text x="58" y="605" font-size="13.5" fill="#1a1a1a">임상 — 심부전에서 ANP · BNP 혈중 농도가 올라간다 → 혈중 BNP = 심부전 진단 지표.</text>
  <text x="58" y="628" font-size="13.5" fill="#1a1a1a">치료제 — carperitide(재조합 ANP · 일본) · nesiritide(재조합 BNP) · ularitide(합성 urodilatin · 임상시험 중).</text>
</svg>
