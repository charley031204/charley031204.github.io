<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 445" width="840" height="445">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2471a3"/>
    </marker>
    <marker id="inh" markerWidth="8" markerHeight="14" refX="4" refY="7" orient="auto">
      <line x1="4" y1="0" x2="4" y2="14" stroke="#c0392b" stroke-width="3"/>
    </marker>
  </defs>
  <g font-family="Malgun Gothic, 맑은 고딕, sans-serif">

    <text x="28" y="26" font-size="16" font-weight="bold" fill="#1a1a1a">Estrogen 합성 경로 · aromatase 억제제의 자리 (교안 p.11–12)</text>

    <!-- left chain -->
    <rect x="55" y="42" width="150" height="34" rx="5" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="130" y="64" font-size="14" text-anchor="middle" fill="#1a1a1a">Cholesterol</text>
    <line x1="130" y1="76" x2="130" y2="98" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="55" y="100" width="150" height="34" rx="5" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="130" y="122" font-size="14" text-anchor="middle" fill="#1a1a1a">Pregnenolone</text>
    <line x1="130" y1="134" x2="130" y2="162" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar)"/>
    <text x="212" y="152" font-size="13" fill="#555555">17α-hydroxylase · 17,20-lyase</text>

    <rect x="35" y="164" width="190" height="34" rx="5" fill="#fdf3e6" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="130" y="186" font-size="14" text-anchor="middle" fill="#1a1a1a">Androstenedione</text>
    <line x1="130" y1="198" x2="130" y2="226" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar)"/>
    <text x="140" y="217" font-size="13" fill="#555555">17β-HSD</text>

    <rect x="55" y="228" width="150" height="34" rx="5" fill="#fdf3e6" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="130" y="250" font-size="14" text-anchor="middle" fill="#1a1a1a">Testosterone</text>
    <line x1="130" y1="262" x2="130" y2="298" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar)"/>
    <text x="140" y="285" font-size="13" fill="#555555">5α-reductase</text>

    <rect x="55" y="300" width="150" height="34" rx="5" fill="#fbe9e6" stroke="#c0392b" stroke-width="1.8"/>
    <text x="130" y="322" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">5α-DHT</text>
    <text x="42" y="352" font-size="13" fill="#c0392b">AR 친화도 최고</text>
    <text x="42" y="370" font-size="13" fill="#c0392b">A 고리 변형 → 방향화 불가</text>

    <!-- aromatase arrows -->
    <line x1="228" y1="181" x2="403" y2="181" stroke="#2471a3" stroke-width="2.5" marker-end="url(#arg)"/>
    <text x="234" y="174" font-size="13" fill="#2471a3" font-weight="bold">aromatase</text>
    <line x1="208" y1="245" x2="403" y2="245" stroke="#2471a3" stroke-width="2.5" marker-end="url(#arg)"/>
    <text x="234" y="238" font-size="13" fill="#2471a3" font-weight="bold">aromatase</text>

    <!-- estrogens -->
    <rect x="405" y="164" width="170" height="34" rx="5" fill="#e6f2ea" stroke="#1e8449" stroke-width="1.8"/>
    <text x="490" y="186" font-size="14" text-anchor="middle" fill="#1e8449" font-weight="bold">Estrone (E1)</text>
    <rect x="405" y="228" width="170" height="34" rx="5" fill="#e6f2ea" stroke="#1e8449" stroke-width="1.8"/>
    <text x="490" y="250" font-size="14" text-anchor="middle" fill="#1e8449" font-weight="bold">17β-Estradiol (E2)</text>
    <line x1="490" y1="200" x2="490" y2="226" stroke="#1e8449" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
    <text x="500" y="219" font-size="13" fill="#1e8449">17β-HSD</text>

    <text x="600" y="176" font-size="13" fill="#1a1a1a" font-weight="bold">효력 E2 &gt; E1 &gt; E3</text>
    <text x="600" y="200" font-size="13" fill="#1a1a1a">가임기 = E2</text>
    <text x="600" y="222" font-size="13" fill="#1a1a1a">폐경 후 = E1</text>
    <text x="600" y="244" font-size="13" fill="#1a1a1a">임신 = E3 (태반)</text>
    <text x="600" y="266" font-size="13" fill="#555555">임신 중 E4(태아 간)</text>

    <!-- aromatase inhibitor -->
    <line x1="310" y1="169" x2="310" y2="193" stroke="#c0392b" stroke-width="3.5"/>
    <line x1="310" y1="233" x2="310" y2="257" stroke="#c0392b" stroke-width="3.5"/>
    <line x1="310" y1="193" x2="310" y2="233" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="310" y1="257" x2="310" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="230" y="300" width="300" height="56" rx="6" fill="#fbe9e6" stroke="#c0392b" stroke-width="2"/>
    <text x="380" y="322" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">Aromatase 억제제</text>
    <text x="380" y="344" font-size="12" text-anchor="middle" fill="#c0392b">anastrozole · letrozole · exemestane · formestane</text>

    <text x="30" y="398" font-size="13" fill="#1a1a1a">· 남성 혈중 estradiol의 약 85%가 이 aromatase 경로 산물 — 고용량 androgen에서 여성형유방이 생기는 이유</text>
    <text x="30" y="420" font-size="13" fill="#1a1a1a">· 폐경 후에는 난소가 아니라 지방·부신 androgen의 방향화가 주 공급원 → 폐경 후 유방암에 aromatase 억제제</text>
  </g>
</svg>
