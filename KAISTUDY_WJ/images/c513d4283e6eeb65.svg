<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2471a3"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">Renin–Angiotensin–Aldosterone 축과 약물 작용점</text>
  <text x="450" y="58" text-anchor="middle" font-size="13.5" fill="#555555">가운데 = 생리 경로(조직과 함께 외운다) · 왼쪽 = 억제 약물이 끊는 마디 · 오른쪽 = ACE2 우회로</text>

  <!-- main chain -->
  <rect x="310" y="80" width="260" height="40" rx="6" fill="#f4f6f6" stroke="#555555" stroke-width="1.8"/>
  <text x="440" y="105" text-anchor="middle" font-size="14.5" fill="#1a1a1a">Angiotensinogen  ·  간</text>
  <line x1="440" y1="120" x2="440" y2="167" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ak)"/>
  <rect x="380" y="128" width="120" height="28" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <text x="440" y="147" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Renin · 신장</text>

  <rect x="310" y="170" width="260" height="40" rx="6" fill="#f4f6f6" stroke="#555555" stroke-width="1.8"/>
  <text x="440" y="195" text-anchor="middle" font-size="14.5" fill="#1a1a1a">Angiotensin I</text>
  <line x1="440" y1="210" x2="440" y2="257" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ak)"/>
  <rect x="380" y="218" width="120" height="28" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <text x="440" y="237" text-anchor="middle" font-size="12.5" fill="#1a1a1a">ACE · 폐</text>

  <rect x="310" y="260" width="260" height="42" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
  <text x="440" y="287" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Angiotensin II</text>
  <line x1="440" y1="302" x2="440" y2="346" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ak)"/>

  <rect x="310" y="350" width="260" height="40" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
  <text x="440" y="375" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">AT1 수용체</text>
  <line x1="440" y1="390" x2="440" y2="434" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ak)"/>

  <rect x="290" y="438" width="300" height="54" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
  <text x="440" y="460" text-anchor="middle" font-size="13.5" fill="#1a1a1a">혈관 수축</text>
  <text x="440" y="481" text-anchor="middle" font-size="13" fill="#1a1a1a">Aldosterone ↑ (부신 사구층) → Na+ 저류</text>
  <line x1="440" y1="492" x2="440" y2="534" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ak)"/>

  <rect x="330" y="538" width="220" height="42" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
  <text x="440" y="566" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">혈압 ↑</text>

  <!-- drug boxes -->
  <rect x="40" y="112" width="240" height="66" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.8"/>
  <text x="52" y="132" font-size="13" font-weight="bold" fill="#c0392b">① Renin 단계</text>
  <text x="52" y="151" font-size="12" fill="#1a1a1a">분비 억제 — propranolol · clonidine</text>
  <text x="52" y="169" font-size="12" fill="#1a1a1a">효소 억제 — aliskiren (경구)</text>
  <line x1="280" y1="145" x2="372" y2="145" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="372" y1="130" x2="372" y2="160" stroke="#c0392b" stroke-width="4.5"/>

  <rect x="40" y="205" width="240" height="60" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.8"/>
  <text x="52" y="225" font-size="13" font-weight="bold" fill="#c0392b">② ACE 억제제</text>
  <text x="52" y="243" font-size="12" fill="#1a1a1a">captopril · enalapril</text>
  <text x="52" y="260" font-size="11.5" fill="#c0392b">→ bradykinin ↑ 로 기침 · 혈관부종</text>
  <line x1="280" y1="232" x2="372" y2="232" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="372" y1="218" x2="372" y2="247" stroke="#c0392b" stroke-width="4.5"/>

  <rect x="40" y="343" width="240" height="58" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.8"/>
  <text x="52" y="363" font-size="13" font-weight="bold" fill="#1e8449">③ ARB (-sartan)</text>
  <text x="52" y="381" font-size="12" fill="#1a1a1a">losartan · valsartan · candesartan</text>
  <text x="52" y="397" font-size="11.5" fill="#1e8449">→ 기침 없음 · 임신 중 금기</text>
  <line x1="280" y1="370" x2="304" y2="370" stroke="#1e8449" stroke-width="2.5"/>
  <line x1="304" y1="355" x2="304" y2="385" stroke="#1e8449" stroke-width="4.5"/>

  <rect x="40" y="440" width="240" height="52" rx="6" fill="#f4f6f6" stroke="#888888" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="52" y="460" font-size="12.5" font-weight="bold" fill="#555555">④ 알도스테론 차단 (교안 밖)</text>
  <text x="52" y="479" font-size="12" fill="#1a1a1a">spironolactone · eplerenone</text>
  <line x1="280" y1="466" x2="286" y2="466" stroke="#888888" stroke-width="2.5"/>
  <line x1="286" y1="451" x2="286" y2="481" stroke="#888888" stroke-width="4.5"/>

  <!-- ACE2 branch -->
  <line x1="570" y1="281" x2="618" y2="281" stroke="#2471a3" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="594" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2471a3">ACE2</text>
  <rect x="622" y="260" width="200" height="42" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.8"/>
  <text x="722" y="287" text-anchor="middle" font-size="15" fill="#1a1a1a">ANG 1–7</text>
  <line x1="722" y1="302" x2="722" y2="342" stroke="#2471a3" stroke-width="2.4" marker-end="url(#ab)"/>
  <rect x="622" y="346" width="235" height="48" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.8"/>
  <text x="739" y="366" text-anchor="middle" font-size="13.5" fill="#1a1a1a">Mas 수용체</text>
  <text x="739" y="385" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2471a3">→  혈관 확장</text>
  <text x="622" y="414" font-size="12" fill="#2471a3">ACE2는 bradykinin에는 작용하지 않는다</text>
  <text x="622" y="432" font-size="12" fill="#555555">활성부위 1개 · carboxypeptidase</text>

  <!-- ARNI note -->
  <rect x="600" y="462" width="270" height="118" rx="6" fill="#fef9e7" stroke="#b9770e" stroke-width="1.8"/>
  <text x="616" y="486" font-size="13" font-weight="bold" fill="#b9770e">참고 — ARNI (교안 밖)</text>
  <text x="616" y="508" font-size="12" fill="#1a1a1a">sacubitril (neprilysin 억제)</text>
  <text x="616" y="527" font-size="12" fill="#1a1a1a">+ valsartan (ARB)</text>
  <text x="616" y="549" font-size="11.5" fill="#555555">natriuretic peptide는 늘리고</text>
  <text x="616" y="567" font-size="11.5" fill="#555555">Ang II 축은 막는 심부전 병합제</text>

  <!-- bottom -->
  <rect x="40" y="610" width="820" height="66" rx="6" fill="#f8f9f9" stroke="#aaaaaa" stroke-width="1.5"/>
  <text x="58" y="635" font-size="13.5" fill="#1a1a1a">조직과 함께 외운다 — Angiotensinogen = 간, Renin = 신장(사구체옆세포), ACE = 폐.</text>
  <text x="58" y="659" font-size="13.5" fill="#1a1a1a">약은 이 사슬의 서로 다른 마디를 끊는다. 끊는 자리가 다르면 부작용도 달라진다.</text>
</svg>
