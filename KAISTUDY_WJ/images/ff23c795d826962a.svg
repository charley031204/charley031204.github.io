<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 z" fill="#2c3e50"/>
</marker>
</defs>
<style>
.t{font-family:"Malgun Gothic","맑은 고딕",sans-serif;}
.ttl{font-size:18px;font-weight:bold;fill:#1a1a1a;}
.bx{font-size:14px;fill:#1a1a1a;font-weight:bold;}
.en{font-size:13px;fill:#c0392b;font-weight:bold;}
.sm{font-size:12px;fill:#424949;}
.note{font-size:12.5px;fill:#1a1a1a;}
</style>

<text class="t ttl" x="20" y="28">히스타민의 합성과 대사 — 화살표가 히스타민으로 들어가는가, 나가는가</text>

<!-- Histidine -->
<rect x="350" y="50" width="180" height="44" fill="#fdedec" stroke="#c0392b" stroke-width="2" rx="4"/>
<text class="t bx" x="440" y="78" text-anchor="middle">Histidine</text>

<line x1="440" y1="94" x2="440" y2="138" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar)"/>
<text class="t en" x="452" y="110">L-Histidine decarboxylase</text>
<text class="t sm" x="452" y="128">조효소 pyridoxal phosphate (비타민 B6) · CO₂ 이탈</text>

<!-- Histamine -->
<rect x="350" y="140" width="180" height="48" fill="#fdedec" stroke="#c0392b" stroke-width="2.5" rx="4"/>
<text class="t bx" x="440" y="170" text-anchor="middle" fill="#c0392b">Histamine</text>

<!-- branch left -->
<line x1="400" y1="188" x2="255" y2="238" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar)"/>
<text class="t en" x="40" y="212">Imidazole N-methyltransferase</text>
<text class="t sm" x="40" y="228">(메틸화 = 주 분해 경로)</text>
<rect x="110" y="240" width="250" height="42" fill="#f4f6f7" stroke="#5d6d7e" rx="4"/>
<text class="t bx" x="235" y="266" text-anchor="middle">N-Methylhistamine</text>

<line x1="235" y1="282" x2="235" y2="328" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar)"/>
<text class="t en" x="245" y="310">Monoamine oxidase B</text>
<rect x="90" y="330" width="290" height="42" fill="#f4f6f7" stroke="#5d6d7e" rx="4"/>
<text class="t bx" x="235" y="356" text-anchor="middle">N-Methylimidazole acetic acid</text>

<!-- branch right -->
<line x1="480" y1="188" x2="625" y2="238" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar)"/>
<text class="t en" x="545" y="212">★ Diamine oxidase</text>
<text class="t sm" x="545" y="228">(교안이 「주요 대사 효소」로 강조)</text>
<rect x="530" y="240" width="250" height="42" fill="#fef9e7" stroke="#b9770e" rx="4"/>
<text class="t bx" x="655" y="266" text-anchor="middle">Imidazoleacetic acid</text>

<line x1="655" y1="282" x2="655" y2="328" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar)"/>
<text class="t en" x="665" y="302">Ribose,</text>
<text class="t en" x="665" y="320">Phosphoribosyl transferase</text>
<rect x="510" y="330" width="290" height="42" fill="#f4f6f7" stroke="#5d6d7e" rx="4"/>
<text class="t bx" x="655" y="356" text-anchor="middle">Imidazoleacetic acid riboside</text>

<!-- note -->
<rect x="20" y="398" width="860" height="76" fill="#f4f6f7" stroke="#aeb6bf"/>
<text class="t note" x="34" y="420">· <tspan font-weight="bold">히스타민을 만드는 효소는 L-histidine decarboxylase 하나뿐</tspan>이고, 나머지 넷은 전부 나가는 쪽(분해)이다.</text>
<text class="t note" x="34" y="442">· ★ Diamine oxidase는 교안이 따로 강조해 이름이 익숙한 탓에 합성 효소로 잘못 고르기 쉽다 — 소크라티브 1번의 대표 오답.</text>
<text class="t note" x="34" y="464">· 히스타민은 생성 즉시 불활성화되거나 저장되며, 대사 산물은 활성이 거의 없이 소변으로 배설된다 (교안 p.13).</text>
</svg>
