<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2471a3"/>
    </marker>
  </defs>

  <text x="440" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">ACE 하나가 두 기질을 처리한다</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#555555">왼쪽 = 승압 축(angiotensin) · 오른쪽 = 확장 축(kinin) · 가운데 효소는 하나뿐이다</text>

  <!-- row 1 -->
  <rect x="100" y="85" width="250" height="40" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
  <text x="225" y="110" text-anchor="middle" font-size="14.5" fill="#1a1a1a">Angiotensinogen  (간)</text>
  <rect x="530" y="85" width="250" height="40" rx="6" fill="#eef5fa" stroke="#2471a3" stroke-width="1.8"/>
  <text x="655" y="110" text-anchor="middle" font-size="14.5" fill="#1a1a1a">Kininogen</text>

  <line x1="225" y1="125" x2="225" y2="164" stroke="#c0392b" stroke-width="2.4" marker-end="url(#aR)"/>
  <text x="235" y="150" font-size="13" fill="#c0392b">renin  (신장 사구체옆세포)</text>
  <line x1="655" y1="125" x2="655" y2="164" stroke="#2471a3" stroke-width="2.4" marker-end="url(#aB)"/>
  <text x="665" y="150" font-size="13" fill="#2471a3">kallikrein</text>

  <!-- row 2 -->
  <rect x="100" y="170" width="250" height="40" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
  <text x="225" y="195" text-anchor="middle" font-size="15" fill="#1a1a1a">Angiotensin I</text>
  <rect x="530" y="170" width="250" height="40" rx="6" fill="#eef5fa" stroke="#2471a3" stroke-width="1.8"/>
  <text x="655" y="195" text-anchor="middle" font-size="14" fill="#1a1a1a">Bradykinin  —  혈관 확장</text>

  <line x1="225" y1="210" x2="225" y2="266" stroke="#c0392b" stroke-width="2.4" marker-end="url(#aR)"/>
  <line x1="655" y1="210" x2="655" y2="266" stroke="#2471a3" stroke-width="2.4" marker-end="url(#aB)"/>

  <!-- ACE inhibitor -->
  <rect x="368" y="176" width="144" height="54" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="440" y="197" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#c0392b">ACE 억제제</text>
  <text x="440" y="217" text-anchor="middle" font-size="12" fill="#1a1a1a">captopril · enalapril</text>
  <line x1="440" y1="230" x2="440" y2="272" stroke="#c0392b" stroke-width="3"/>
  <line x1="412" y1="272" x2="468" y2="272" stroke="#c0392b" stroke-width="4.5"/>

  <!-- ACE bar -->
  <rect x="80" y="272" width="720" height="50" rx="7" fill="#fdebd0" stroke="#b9770e" stroke-width="2.5"/>
  <text x="440" y="295" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">ACE   =   kininase II    (폐 혈관내피에 풍부)</text>
  <text x="440" y="314" text-anchor="middle" font-size="12.5" fill="#555555">carboxyl 말단에서 아미노산을 2개씩 잘라낸다 · enkephalin, substance P도 같은 효소가 분해</text>

  <line x1="225" y1="322" x2="225" y2="366" stroke="#c0392b" stroke-width="2.4" marker-end="url(#aR)"/>
  <line x1="655" y1="322" x2="655" y2="366" stroke="#2471a3" stroke-width="2.4" marker-end="url(#aB)"/>

  <!-- row 3 -->
  <rect x="100" y="370" width="250" height="42" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="225" y="396" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1a1a1a">Angiotensin II</text>
  <rect x="530" y="370" width="250" height="42" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="655" y="396" text-anchor="middle" font-size="14" fill="#1a1a1a">불활성 조각 (활성 소실)</text>

  <line x1="225" y1="412" x2="225" y2="450" stroke="#c0392b" stroke-width="2.4" marker-end="url(#aR)"/>
  <line x1="655" y1="412" x2="655" y2="428" stroke="#2471a3" stroke-width="2.4" marker-end="url(#aB)"/>

  <!-- row 4 : AT1 -->
  <rect x="100" y="454" width="250" height="40" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
  <text x="225" y="479" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">AT1 수용체</text>

  <rect x="378" y="448" width="172" height="52" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="464" y="468" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e8449">ARB (-sartan)</text>
  <text x="464" y="487" text-anchor="middle" font-size="11.5" fill="#1a1a1a">losartan · valsartan …</text>
  <line x1="378" y1="474" x2="356" y2="474" stroke="#1e8449" stroke-width="3"/>
  <line x1="356" y1="457" x2="356" y2="491" stroke="#1e8449" stroke-width="4.5"/>

  <line x1="225" y1="494" x2="225" y2="532" stroke="#c0392b" stroke-width="2.4" marker-end="url(#aR)"/>

  <rect x="60" y="536" width="330" height="58" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="225" y="559" text-anchor="middle" font-size="13.5" fill="#1a1a1a">혈관 수축 · aldosterone ↑ · Na+ 저류</text>
  <text x="225" y="580" text-anchor="middle" font-size="13.5" fill="#1a1a1a">갈증 · 세포성장   →   혈압 ↑</text>

  <!-- right note -->
  <rect x="500" y="430" width="345" height="105" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="518" y="455" font-size="14" font-weight="bold" fill="#2471a3">ACE를 막으면 (ACE 억제제)</text>
  <text x="518" y="478" font-size="13" fill="#1a1a1a">bradykinin이 분해되지 못하고 축적된다</text>
  <text x="518" y="500" font-size="13.5" font-weight="bold" fill="#1a1a1a">→  마른기침 · 혈관부종</text>
  <text x="518" y="522" font-size="12" fill="#555555">ARB는 이 축을 전혀 건드리지 않는다</text>

  <!-- bottom summary -->
  <rect x="60" y="615" width="780" height="62" rx="6" fill="#f8f9f9" stroke="#aaaaaa" stroke-width="1.5"/>
  <text x="80" y="640" font-size="13.5" fill="#1a1a1a">자물쇠 하나를 잠갔더니 문 두 개가 동시에 바뀐다 — 왼쪽은 치료 효과(Ang II ↓ → 혈압 ↓),</text>
  <text x="80" y="662" font-size="13.5" fill="#1a1a1a">오른쪽은 부작용(bradykinin ↑ → 기침 · 혈관부종).  ARB는 오른쪽 문을 열어둔 채 왼쪽만 막는다.</text>
</svg>
