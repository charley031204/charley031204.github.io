<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="b1" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="b2" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2471a3"/>
    </marker>
    <marker id="b3" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="440" y="30" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Vasopressin의 두 수용체와 desmopressin의 선택성</text>

  <rect x="330" y="52" width="220" height="46" rx="8" fill="#fdebd0" stroke="#b9770e" stroke-width="2.5"/>
  <text x="440" y="72" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#7e5109" text-anchor="middle">Vasopressin (ADH)</text>
  <text x="440" y="90" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" fill="#7e5109" text-anchor="middle">삼투압↑ 또는 혈압↓ → 후엽에서 분비</text>

  <line x1="380" y1="98" x2="245" y2="145" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#b1)"/>
  <line x1="500" y1="98" x2="635" y2="145" stroke="#2471a3" stroke-width="3" marker-end="url(#b2)"/>

  <!-- V1 -->
  <rect x="60" y="150" width="330" height="82" rx="8" fill="#eaeded" stroke="#566573" stroke-width="2"/>
  <text x="225" y="174" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V₁ 수용체</text>
  <text x="225" y="197" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">혈관 평활근 → 수축</text>
  <text x="225" y="219" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">= 승압 작용</text>

  <!-- V2 -->
  <rect x="490" y="150" width="330" height="82" rx="8" fill="#d6eaf8" stroke="#2471a3" stroke-width="2.5"/>
  <text x="655" y="174" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="17" font-weight="bold" fill="#1a4e73" text-anchor="middle">V₂ 수용체</text>
  <text x="655" y="197" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" fill="#1a4e73" text-anchor="middle">집합관 → 수분 재흡수</text>
  <text x="655" y="219" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="15" font-weight="bold" fill="#1a4e73" text-anchor="middle">= 항이뇨 작용</text>

  <!-- desmopressin -->
  <rect x="60" y="268" width="330" height="76" rx="8" fill="#ffffff" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="225" y="292" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#7f8c8d" text-anchor="middle">desmopressin은 여기를 거의 안 건드린다</text>
  <text x="225" y="315" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">그래서 혈압 상승은 이 약의 위험이 아니다</text>
  <text x="225" y="335" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">25-31 ①·N08 10번 ①이 노리는 오답</text>

  <line x1="655" y1="232" x2="655" y2="266" stroke="#2471a3" stroke-width="3" marker-end="url(#b2)"/>

  <rect x="490" y="268" width="330" height="76" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.5"/>
  <text x="655" y="292" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="16" font-weight="bold" fill="#145a32" text-anchor="middle">Desmopressin (DDAVP)</text>
  <text x="655" y="314" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#145a32" text-anchor="middle">V₂ 선택적 — 항이뇨가 승압보다 수천 배</text>
  <text x="655" y="334" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" font-weight="bold" fill="#145a32" text-anchor="middle">중추성 요붕증 1차 치료제 · 야뇨증</text>

  <line x1="655" y1="344" x2="655" y2="382" stroke="#c0392b" stroke-width="3" marker-end="url(#b3)"/>
  <text x="672" y="368" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#c0392b">과용</text>

  <rect x="440" y="386" width="420" height="94" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="2.5"/>
  <text x="650" y="409" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#922b21" text-anchor="middle">수분 재흡수 ↑↑ → 체내 수분 저류</text>
  <text x="650" y="431" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" fill="#922b21" text-anchor="middle">→ 혈장이 희석된다</text>
  <text x="650" y="454" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="16" font-weight="bold" fill="#922b21" text-anchor="middle">→ 저나트륨혈증 → 경련</text>
  <text x="650" y="472" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="12" fill="#922b21" text-anchor="middle">그래서 수분 섭취 제한 교육이 반드시 따라간다</text>

  <rect x="20" y="386" width="390" height="94" rx="8" fill="#fef9e7" stroke="#b9770e" stroke-width="2"/>
  <text x="215" y="409" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="14" font-weight="bold" fill="#7e5109" text-anchor="middle">방향을 헷갈리지 않는 법</text>
  <text x="215" y="431" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#7e5109" text-anchor="middle">ADH 결핍 = 물이 새어 나간다 → 요붕증</text>
  <text x="215" y="452" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#7e5109" text-anchor="middle">ADH 과다 = 물을 붙잡는다 → 나트륨이 묽어진다</text>
  <text x="215" y="472" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" font-weight="bold" fill="#7e5109" text-anchor="middle">물이 움직이는 방향만 따라가면 된다</text>

  <rect x="20" y="496" width="840" height="32" rx="6" fill="#f4f6f6" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="34" y="517" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="13" fill="#1a1a1a">구조 — desmopressin은 1번 잔기를 탈아민화하고 8번을 D-Arg로 바꾼 vasopressin이다. 이 두 곳의 변형이 V₂ 선택성과 긴 작용시간을 만든다.</text>
</svg>
