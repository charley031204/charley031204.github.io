<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 530" width="870" height="530">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2471a3"/>
    </marker>
    <marker id="inh" markerWidth="8" markerHeight="18" refX="4" refY="9" orient="auto">
      <line x1="4" y1="0" x2="4" y2="18" stroke="#c0392b" stroke-width="3.5"/>
    </marker>
  </defs>
  <g font-family="Malgun Gothic, 맑은 고딕, sans-serif">

    <text x="25" y="26" font-size="16" font-weight="bold" fill="#1a1a1a">Androgen 대사 경로와 항안드로겐 3계열의 작용점 (교안 p.43 · 47 · 49–52)</text>

    <!-- central chain -->
    <rect x="350" y="40" width="160" height="38" rx="5" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="430" y="64" font-size="14" text-anchor="middle" fill="#1a1a1a">Cholesterol</text>
    <line x1="430" y1="78" x2="430" y2="116" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="446" y="104" font-size="12.5" fill="#555555">17α-hydroxylase · 17,20-lyase</text>

    <rect x="345" y="118" width="170" height="40" rx="5" fill="#fdf3e6" stroke="#1a1a1a" stroke-width="1.8"/>
    <text x="430" y="144" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Testosterone</text>
    <line x1="430" y1="158" x2="430" y2="203" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="446" y="188" font-size="12.5" fill="#555555">5α-reductase</text>

    <rect x="350" y="205" width="160" height="40" rx="5" fill="#fbe9e6" stroke="#c0392b" stroke-width="1.8"/>
    <text x="430" y="231" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">5α-DHT</text>
    <line x1="430" y1="245" x2="430" y2="288" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="330" y="290" width="200" height="46" rx="5" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
    <text x="430" y="319" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Androgen 수용체 (AR)</text>
    <line x1="430" y1="336" x2="430" y2="376" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="300" y="378" width="260" height="44" rx="5" fill="#e6f2ea" stroke="#1e8449" stroke-width="1.8"/>
    <text x="430" y="406" font-size="14" text-anchor="middle" fill="#1e8449" font-weight="bold">전립샘 · 피부 · 부고환 효과</text>

    <!-- aromatase branch -->
    <line x1="518" y1="138" x2="634" y2="138" stroke="#2471a3" stroke-width="2.5" marker-end="url(#arb)"/>
    <text x="528" y="130" font-size="12.5" fill="#2471a3" font-weight="bold">aromatase</text>
    <rect x="638" y="118" width="190" height="40" rx="5" fill="#e6f2ea" stroke="#1e8449" stroke-width="1.8"/>
    <text x="733" y="144" font-size="14" text-anchor="middle" fill="#1e8449" font-weight="bold">Estradiol (E2)</text>
    <text x="638" y="180" font-size="12.5" fill="#1a1a1a">고용량 androgen →</text>
    <text x="638" y="199" font-size="12.5" fill="#1a1a1a">여성형유방 · 유방압통</text>
    <text x="638" y="228" font-size="12.5" fill="#c0392b">DHT는 A 고리 변형 →</text>
    <text x="638" y="247" font-size="12.5" fill="#c0392b">→ 여성형유방 없음</text>

    <!-- inhibitor class 1 -->
    <rect x="25" y="52" width="285" height="72" rx="6" fill="#fbe9e6" stroke="#c0392b" stroke-width="2"/>
    <text x="38" y="76" font-size="14" fill="#c0392b" font-weight="bold">① 스테로이드 합성 억제</text>
    <text x="38" y="98" font-size="13" fill="#1a1a1a">Ketoconazole (고용량)</text>
    <text x="38" y="117" font-size="13" fill="#c0392b" font-weight="bold">Spironolactone ★</text>
    <line x1="312" y1="100" x2="426" y2="100" stroke="#c0392b" stroke-width="2.5" marker-end="url(#inh)"/>

    <!-- inhibitor class 2 -->
    <rect x="25" y="150" width="285" height="72" rx="6" fill="#fbe9e6" stroke="#c0392b" stroke-width="2"/>
    <text x="38" y="174" font-size="14" fill="#c0392b" font-weight="bold">② 5α-Reductase 억제</text>
    <text x="38" y="196" font-size="13" fill="#1a1a1a">Finasteride — 2 · 3형</text>
    <text x="38" y="215" font-size="13" fill="#1a1a1a">Dutasteride — 1형 포함 전부</text>
    <line x1="312" y1="184" x2="426" y2="184" stroke="#c0392b" stroke-width="2.5" marker-end="url(#inh)"/>

    <!-- inhibitor class 3 -->
    <rect x="25" y="252" width="285" height="94" rx="6" fill="#fbe9e6" stroke="#c0392b" stroke-width="2"/>
    <text x="38" y="276" font-size="14" fill="#c0392b" font-weight="bold">③ AR 수용체 차단</text>
    <text x="38" y="297" font-size="13" fill="#1a1a1a">Flutamide · Bicalutamide</text>
    <text x="38" y="316" font-size="13" fill="#1a1a1a">Enzalutamide · Nilutamide</text>
    <text x="38" y="335" font-size="13" fill="#1a1a1a">Cyproterone · <tspan fill="#c0392b" font-weight="bold">Spironolactone ★</tspan></text>
    <line x1="312" y1="313" x2="326" y2="313" stroke="#c0392b" stroke-width="2.5" marker-end="url(#inh)"/>

    <!-- dual marking connector -->
    <path d="M18,105 L10,105 L10,320 L18,320" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>

    <text x="25" y="452" font-size="13" fill="#c0392b" font-weight="bold">★ Spironolactone만 ①과 ③ 양쪽에 걸린다 — AR을 막으면서 17α-hydroxylase · 17,20-lyase까지 억제해</text>
    <text x="39" y="472" font-size="13" fill="#c0392b" font-weight="bold">혈중 testosterone · androstenedione 자체를 낮춘다. 25-47의 감별점이 이 이중 작용이다.</text>
    <text x="25" y="498" font-size="13" fill="#1a1a1a">· 25-18 = ③ AR 차단(flutamide, 남성 전립샘암) / 소크라티브 N09 9번 = ② 전부 억제(dutasteride)</text>
  </g>
</svg>
